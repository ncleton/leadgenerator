name: Bug report
description: Report a reproducible problem without including private data.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Never include secrets, customer data, profiles, browser sessions, or lead exports.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps using fictional or public test data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python, uv, Codex, and Lead Generator versions.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal profiles, customer data, and lead exports.
          required: true
