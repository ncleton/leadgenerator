name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LEADGENERATOR_TEST_POSTGRES_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --project plugins/leadgenerator --frozen
      - run: uv run --project plugins/leadgenerator playwright install --with-deps chromium
      - run: ./scripts/validate.sh
      - name: Verify clean first-objective onboarding
        run: uv run --project plugins/leadgenerator python scripts/verify_workspace.py

  portable-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Parse the Windows installer with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\scripts\install_client.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - run: uv sync --project plugins/leadgenerator --frozen
      - name: Install the browser used by runtime tests
        # The runtime suite exercises native MCP Apps in a real browser.
        run: uv run --project plugins/leadgenerator playwright install chromium
      - name: Run portable storage, installation and runtime contracts
        run: >-
          uv run --project plugins/leadgenerator pytest
          -c plugins/leadgenerator/pyproject.toml
          tests
      - name: Verify clean first-objective onboarding
        run: uv run --project plugins/leadgenerator python scripts/verify_workspace.py
