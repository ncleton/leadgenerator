name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  installer-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: checkout-source
      - name: Prepare a flat GitHub download without precreating code
        shell: bash
        run: git clone --no-hardlinks checkout-source "portable agent é"
      - name: Install Codex plugin from a fresh source folder
        if: runner.os != 'Windows'
        env:
          CODEX_HOME: ${{ runner.temp }}/leadgenerator-codex
        working-directory: portable agent é
        run: ./scripts/install_client.sh
      - name: Install Codex plugin on Windows
        if: runner.os == 'Windows'
        env:
          CODEX_HOME: ${{ runner.temp }}/leadgenerator-codex
        shell: powershell
        working-directory: portable agent é
        run: .\scripts\install_client.ps1
      - name: Install Claude Code from the same source folder
        if: runner.os != 'Windows'
        working-directory: portable agent é/code
        run: ./scripts/install_client.sh --host claude-code
      - name: Install Claude Desktop from the same source folder
        if: runner.os == 'macOS'
        working-directory: portable agent é/code
        run: ./scripts/install_client.sh --host claude-desktop
      - name: Install Claude hosts on Windows
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: portable agent é/code
        run: |
          .\scripts\install_client.ps1 -HostTarget claude-code
          .\scripts\install_client.ps1 -HostTarget claude-desktop
      - name: Verify the private folder is next to the source
        shell: bash
        run: |
          test -d "portable agent é/donnees-privees"
          test -d "portable agent é/code/.git"
          test ! -e "portable agent é/.git"
          test -f "portable agent é/AGENTS.md"
          test -f "portable agent é/CLAUDE.md"
          test -f "portable agent é/.mcp.json"
          test -f "portable agent é/code/AGENTS.md"
          test -f "portable agent é/code/.gitignore"
          test ! -d "portable agent é/code/donnees-privees"
          test -z "$(find 'portable agent é/donnees-privees' -name objective.json -print -quit)"

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LEADGENERATOR_TEST_POSTGRES_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --project plugins/leadgenerator --frozen
      - run: uv run --project plugins/leadgenerator playwright install --with-deps chromium
      - run: ./scripts/validate.sh
      - name: Verify clean first-objective onboarding
        run: uv run --project plugins/leadgenerator python scripts/verify_workspace.py

  portable-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Parse the Windows installer with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\scripts\install_client.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - run: uv sync --project plugins/leadgenerator --frozen
      - name: Install the browser used by runtime tests
        # The runtime suite exercises native MCP Apps in a real browser.
        run: uv run --project plugins/leadgenerator playwright install chromium
      - name: Run portable storage, installation and runtime contracts
        run: >-
          uv run --project plugins/leadgenerator pytest
          -c plugins/leadgenerator/pyproject.toml
          tests
      - name: Verify clean first-objective onboarding
        run: uv run --project plugins/leadgenerator python scripts/verify_workspace.py
