apiVersion: leadgenerator.yaka/v1
kind: Plugin
metadata:
  id: yaka.fullenrich
  version: 1.0.0
  tier: native
spec:
  requiresSdk: ">=1.0.0,<2.0.0"
  runtime: python
  entrypoint: leadgenerator.native.activators:activate_fullenrich
  provides: [enrichment.fullenrich]
  requires: [observations, approvals]
  contributes:
    - registry: workflow.steps
      ids: [enrichment.fullenrich]
  permissions:
    network: [api.fullenrich.com]
    secrets: [FULLENRICH_API_KEY]
    paidReads: true
  configuration:
    schema: config.schema.json
  healthCheck: services
