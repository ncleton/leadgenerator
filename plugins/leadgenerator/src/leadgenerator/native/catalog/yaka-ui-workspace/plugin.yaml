apiVersion: leadgenerator.yaka/v1
kind: Plugin
metadata:
  id: yaka.ui-workspace
  version: 1.0.0
  tier: native
spec:
  requiresSdk: ">=1.0.0,<2.0.0"
  runtime: python
  entrypoint: leadgenerator.native.activators:activate_ui_workspace
  provides: [ui.shell]
  requires: [observations, approvals]
  contributes:
    - registry: ui.tabs
      ids: [native.workspace]
  permissions:
    network: [public-http-https]
  configuration:
    schema: config.schema.json
  healthCheck: services
