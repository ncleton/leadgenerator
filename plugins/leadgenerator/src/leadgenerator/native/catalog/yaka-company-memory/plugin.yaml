apiVersion: leadgenerator.yaka/v1
kind: Plugin
metadata:
  id: yaka.company-memory
  version: 1.0.0
  tier: native
spec:
  requiresSdk: ">=1.0.0,<2.0.0"
  runtime: python
  entrypoint: leadgenerator.native.activators:activate_company_memory
  provides: [company-memory]
  requires: [observations]
  contributes: []
  permissions:
    filesystem: [private.database]
    secrets: [LEADGENERATOR_DATABASE_URL]
  configuration:
    schema: config.schema.json
  healthCheck: services
