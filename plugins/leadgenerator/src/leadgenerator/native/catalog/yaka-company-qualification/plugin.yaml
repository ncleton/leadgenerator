apiVersion: leadgenerator.yaka/v1
kind: Plugin
metadata:
  id: yaka.company-qualification
  version: 1.0.0
  tier: native
spec:
  requiresSdk: ">=1.0.0,<2.0.0"
  runtime: python
  entrypoint: leadgenerator.native.activators:activate_company_qualification
  provides: [company-qualification]
  requires: [observations, public-web]
  contributes:
    - registry: research.analyzers
      ids: [company-qualification]
  permissions:
    network: [public-http-https]
  configuration:
    schema: config.schema.json
  healthCheck: services
