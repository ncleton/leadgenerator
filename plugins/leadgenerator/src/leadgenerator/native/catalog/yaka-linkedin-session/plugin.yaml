apiVersion: leadgenerator.yaka/v1
kind: Plugin
metadata:
  id: yaka.linkedin-session
  version: 1.0.0
  tier: native
spec:
  requiresSdk: ">=1.0.0,<2.0.0"
  runtime: python
  entrypoint: leadgenerator.native.activators:activate_linkedin_session
  provides: [linkedin.session]
  requires: [approvals]
  contributes:
    - registry: workflow.steps
      ids: [linkedin.browser-research]
  permissions: {}
  configuration:
    schema: config.schema.json
  healthCheck: services
