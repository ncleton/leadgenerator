apiVersion: leadgenerator.yaka/v1
kind: Plugin
metadata:
  id: yaka.objectives
  version: 1.0.0
  tier: native
spec:
  requiresSdk: ">=1.0.0,<2.0.0"
  runtime: python
  entrypoint: leadgenerator.native.activators:activate_objectives
  provides: [objectives]
  requires: [orchestrator]
  contributes: []
  permissions:
    filesystem: [private.objectives]
  configuration:
    schema: config.schema.json
  healthCheck: services
